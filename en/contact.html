<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WW Cosmétiques · Contact</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="../assets/lang-switcher.css">
<style>
  body { background: #0A0A0A; color: #F4F1EC; }
  .nav { background: rgba(10,10,10,0.7); border-bottom: 1px solid rgba(255,255,255,0.06); }
  .nav a { color: #F4F1EC; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 6rem 2rem; }
  input, textarea { width: 100%; background: transparent; border: none; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 1rem 0; color: #fff; font-family: inherit; font-size: 1rem; margin-bottom: 1rem; outline: none; }
  input:focus, textarea:focus { border-color: #C8A24B; }
  label { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; opacity: 0.5; }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="logo" style="font-family:'Playfair Display',serif;">WW</a>
  <div class="nav-links">
    <a href="him.html">Him</a>
    <a href="her.html">Her</a>
    <a href="story.html">Story</a>
  </div>
  <span data-lang-switch data-current="en" data-fr="../contact.html" data-en="contact.html"></span>
  <span style="font-size:0.75rem; letter-spacing:0.25em; text-transform:uppercase; opacity:0.6;">Contact</span>
</nav>

<div class="wrap">
  <p class="section-label" style="color:#C8A24B;">Reach Out</p>
  <h1 class="serif" style="font-size: clamp(2rem,4vw,3.5rem); margin: 0 0 2rem;">Let's <em style="color:#C8A24B;">talk</em>.</h1>
  <p style="opacity:0.75; line-height:1.7; margin-bottom:3rem;">Press, partnerships, wholesale or just a question — we read every message.</p>

  <form onsubmit="event.preventDefault(); alert('Message sent ✦');">
    <label>Name</label>
    <input type="text" required />
    <label>Email</label>
    <input type="email" required />
    <label>Message</label>
    <textarea rows="4" required></textarea>
    <button class="btn" style="background:#C8A24B; border-color:#C8A24B; color:#000; margin-top:1rem;"><span>Send →</span></button>
  </form>
</div>

<script src="../assets/lang-switcher.js"></script>
</body>
</html>
