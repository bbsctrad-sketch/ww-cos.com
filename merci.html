<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci — WW Cosmétiques</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0D0D0D; color: #F5F5F3;
      font-family: 'Karla', sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
    }
    .card {
      max-width: 480px; border: 1px solid rgba(255,255,255,0.08);
      padding: 3rem 2.5rem; background: #111;
    }
    .check { font-size: 3rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 1rem; }
    p { opacity: 0.55; line-height: 1.75; font-size: 0.95rem; margin-bottom: 2rem; }
    a {
      display: inline-block; background: #F5F5F3; color: #0D0D0D;
      font-weight: 800; font-size: 0.85rem; letter-spacing: 0.1em;
      text-transform: uppercase; text-decoration: none;
      padding: 0.9rem 2rem;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>Merci pour votre commande&nbsp;!</h1>
    <p>Votre paiement a été confirmé. Vous allez recevoir un email de confirmation sous peu. Votre commande est en cours de préparation.</p>
    <a href="him.html">← Retour à la boutique</a>
  </div>
</body>
</html>
